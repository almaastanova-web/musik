<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Новогодний драйв 2027 — Год Козы 🐐</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #c0392b;
  --dark-red: #922B21;
  --green: #1a7a3a;
  --dark-green: #0e5c2a;
  --gold: #f1c40f;
  --dark-gold: #d4ac0d;
  --snow: #ecf0f1;
  --bg: #0b1a2b;
}

body {
  font-family: 'Comfortaa', cursive, sans-serif;
  background: linear-gradient(180deg, #0b1a2b 0%, #1a3a5c 50%, #0b1a2b 100%);
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
  position: relative;
}

/* === СНЕГ === */
.snowfall {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.snowflake {
  position: absolute;
  top: -20px;
  color: #fff;
  font-size: 1em;
  opacity: 0.8;
  animation: fall linear infinite;
  text-shadow: 0 0 5px rgba(255,255,255,0.5);
}

@keyframes fall {
  0% { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.6; }
  100% { transform: translateY(100vh) rotate(360deg) translateX(80px); opacity: 0; }
}

/* === КОНТЕЙНЕР === */
.container {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* === ГИРЛЯНДА === */
.garland {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.garland-light {
  width: 14px; height: 14px;
  border-radius: 50%;
  animation: glow 1.5s ease-in-out infinite alternate;
}

.garland-light:nth-child(4n+1) { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; animation-delay: 0s; }
.garland-light:nth-child(4n+2) { background: #f1c40f; box-shadow: 0 0 10px #f1c40f; animation-delay: 0.3s; }
.garland-light:nth-child(4n+3) { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; animation-delay: 0.6s; }
.garland-light:nth-child(4n+4) { background: #3498db; box-shadow: 0 0 10px #3498db; animation-delay: 0.9s; }

@keyframes glow {
  0% { opacity: 0.4; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.2); }
}

/* === КАРТОЧКА === */
.card {
  background: linear-gradient(135deg, rgba(192,57,43,0.15), rgba(26,122,58,0.15));
  border: 2px solid rgba(241,196,15,0.3);
  border-radius: 24px;
  padding: 40px;
  backdrop-filter: blur(10px);
  width: 100%;
  max-width: 700px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  animation: cardAppear 0.5s ease-out;
}

@keyframes cardAppear {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* === ЗАГОЛОВКИ === */
.title {
  font-size: 2.2em;
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--gold), #fff, var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  line-height: 1.3;
}

.subtitle {
  text-align: center;
  color: rgba(255,255,255,0.7);
  margin-bottom: 30px;
  font-size: 1em;
}

.goat-emoji {
  font-size: 3em;
  display: block;
  text-align: center;
  margin-bottom: 15px;
}

/* === МЕНЮ РАУНДОВ === */
.rounds-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.round-btn {
  background: linear-gradient(135deg, var(--dark-red), var(--red));
  border: 2px solid rgba(241,196,15,0.4);
  border-radius: 16px;
  padding: 20px 15px;
  color: #fff;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: center;
  font-family: 'Comfortaa', cursive, sans-serif;
  font-size: 0.95em;
}

.round-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(192,57,43,0.4);
  border-color: var(--gold);
}

.round-btn:active { transform: translateY(0); }

.round-btn .label {
  font-weight: bold;
  font-size: 1.1em;
}

/* === ПРОГРЕСС === */
.progress-bar {
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  margin-bottom: 25px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--gold));
  border-radius: 10px;
  transition: width 0.5s ease;
}

.question-counter {
  text-align: center;
  color: rgba(255,255,255,0.6);
  margin-bottom: 15px;
  font-size: 0.9em;
}

/* === ВОПРОС === */
.question-text {
  font-size: 1.25em;
  text-align: center;
  margin-bottom: 25px;
  line-height: 1.6;
  color: #fff;
  min-height: 60px;
}

/* === ВАРИАНТЫ ОТВЕТА === */
.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option-btn {
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 16px 20px;
  color: #fff;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Comfortaa', cursive, sans-serif;
  font-size: 1em;
  text-align: left;
}

.option-btn:hover {
  background: rgba(241,196,15,0.15);
  border-color: var(--gold);
  transform: translateX(5px);
}

/* === ПОДСКАЗКА === */
.btn-hint {
  display: block;
  margin: 0 auto 15px auto;
  background: rgba(255,255,255,0.1);
  border: 1px dashed var(--gold);
  color: var(--gold);
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Comfortaa', cursive, sans-serif;
  font-size: 0.9em;
  transition: all 0.3s;
}

.btn-hint:hover {
  background: rgba(241,196,15,0.15);
  transform: translateY(-2px);
}

.hint-text {
  text-align: center;
  color: var(--gold);
  margin-bottom: 15px;
  font-style: italic;
  animation: cardAppear 0.3s ease-out;
}

/* === ПРАВДА/ЛОЖЬ и САМОПРОВЕРКА === */
.tf-buttons {
  display: flex;
  gap: 15px;
}

.tf-btn {
  flex: 1;
  padding: 20px;
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  cursor: pointer;
  font-family: 'Comfortaa', cursive, sans-serif;
  font-size: 1.1em;
  font-weight: bold;
  color: #fff;
  transition: all 0.3s ease;
}

.tf-btn.true-btn { background: linear-gradient(135deg, #27ae60, #2ecc71); }
.tf-btn.false-btn { background: linear-gradient(135deg, #c0392b, #e74c3c); }

.tf-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }

/* === УГАДАЙ МЕЛОДИЮ === */
.melody-play-btn {
  display: block;
  margin: 0 auto 20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--dark-gold));
  border: none;
  cursor: pointer;
  font-size: 2em;
  color: #fff;
  transition: all 0.3s ease;
  box-shadow: 0 5px 20px rgba(241,196,15,0.4);
}

.melody-play-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 8px 30px rgba(241,196,15,0.6);
}

.melody-play-btn.playing {
  animation: musicPulse 0.5s ease-in-out infinite alternate;
}

@keyframes musicPulse {
  from { transform: scale(1); box-shadow: 0 5px 20px rgba(241,196,15,0.4); }
  to { transform: scale(1.08); box-shadow: 0 8px 35px rgba(241,196,15,0.7); }
}

/* === ПРОДОЛЖИ СТРОЧКУ === */
.poem-word {
  text-align: center;
  font-size: 1.1em;
  font-weight: bold;
  color: var(--gold);
  margin-bottom: 20px;
  padding: 20px;
  background: rgba(241,196,15,0.1);
  border-radius: 14px;
  border: 1px solid rgba(241,196,15,0.3);
  line-height: 1.5;
}

.poem-guess {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.poem-option {
  padding: 14px;
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  color: #fff;
  cursor: pointer;
  font-family: 'Comfortaa', cursive, sans-serif;
  font-size: 0.95em;
  transition: all 0.3s ease;
  text-align: center;
}

.poem-option:hover {
  border-color: var(--gold);
  background: rgba(241,196,15,0.1);
}

/* === РЕЗУЛЬТАТЫ === */
.result-score {
  text-align: center;
  font-size: 3em;
  font-weight: bold;
  color: var(--gold);
  margin: 15px 0;
}

.result-stars {
  text-align: center;
  font-size: 2.5em;
  margin-bottom: 15px;
}

.result-message {
  text-align: center;
  font-size: 1.1em;
  color: rgba(255,255,255,0.8);
  margin-bottom: 25px;
  line-height: 1.6;
}

.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.btn-primary {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--red), var(--dark-red));
  color: #fff;
  font-family: 'Comfortaa', cursive, sans-serif;
  font-size: 1em;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(192,57,43,0.4); }

.btn-secondary {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.2);
  background: transparent;
  color: #fff;
  font-family: 'Comfortaa', cursive, sans-serif;
  font-size: 1em;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-secondary:hover { border-color: var(--gold); background: rgba(241,196,15,0.1); }

/* === TOTAL SCORE === */
.total-score-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  background: rgba(241,196,15,0.1);
  border-radius: 30px;
  border: 1px solid rgba(241,196,15,0.3);
  margin-bottom: 20px;
  font-size: 1em;
}

/* === RESPONSIVE === */
@media (max-width: 600px) {
  .card { padding: 25px 18px; }
  .title { font-size: 1.6em; }
  .rounds-grid { grid-template-columns: 1fr; }
  .poem-guess { grid-template-columns: 1fr; }
  .tf-buttons { flex-direction: column; }
  .btn-row { flex-direction: column; }
}

/* === ЁЛКА ДЕКОР === */
.tree-deco {
  text-align: center;
  font-size: 1.2em;
  margin-bottom: 5px;
  opacity: 0.6;
}

/* === CONFETTI === */
.confetti-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
}

.confetti-piece {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 10px;
  animation: confettiFall 3s ease-in forwards;
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* === КНОПКА МУЗЫКИ (внизу справа) === */
.music-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  padding: 12px 20px;
  border-radius: 30px;
  border: 2px solid var(--gold);
  color: var(--gold);
  background: rgba(11, 26, 43, 0.85);
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  font-family: 'Comfortaa', cursive, sans-serif;
  font-size: 0.9em;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.music-btn:hover {
  background: rgba(241, 196, 15, 0.15);
  transform: translateY(-2px);
}

@media (max-width: 600px) {
  .music-btn {
    bottom: 15px;
    right: 15px;
    padding: 10px 16px;
    font-size: 0.85em;
  }
}
</style>
</head>
<body>

<div class="snowfall" id="snowfall"></div>

<div class="container">
  <div class="garland" id="garland"></div>
  <div id="app"></div>
</div>

<!-- Кнопка музыки внизу справа -->
<button id="musicToggleBtn" class="music-btn" onclick="toggleMusic()">
  🎵 <span id="musicBtnText">Включить музыку</span>
</button>

<script>
// === ФОНОВАЯ МУЗЫКА ===
const bgMusicUrls = {
  intro: encodeURI("https://raw.githubusercontent.com/almaastanova-web/musik/main/1.mp3"),
  quiz: encodeURI("https://raw.githubusercontent.com/almaastanova-web/musik/main/2 Детские новогодние песни - Что такое Новый Год_ (Минус).mp3"),
  rebus: encodeURI("https://raw.githubusercontent.com/almaastanova-web/musik/main/3 Детские новогодние песни - Здравствуй дедушка мороз (минус).mp3"),
  riddle: "https://raw.githubusercontent.com/almaastanova-web/musik/main/4.mp3",
  truth: encodeURI("https://raw.githubusercontent.com/almaastanova-web/musik/main/5 Детские новогодние минусовки - Новогодняя ночь (-) x-minus.org.mp3"),
  poem: encodeURI("https://raw.githubusercontent.com/almaastanova-web/musik/main/6.mp3")
};

let bgAudio = null;
let introMusicStarted = false;

function playBgMusic(url) {
  if (bgAudio) {
    bgAudio.pause();
    bgAudio.currentTime = 0;
  }
  if (url) {
    bgAudio = new Audio(url);
    bgAudio.loop = true;
    bgAudio.volume = 0.5;
    bgAudio.play().catch(e => {
      console.log("Фоновая музыка заблокирована браузером. Используйте кнопку включения.", e);
    });
  }
}

function stopBgMusic() {
  if (bgAudio) {
    bgAudio.pause();
    bgAudio.currentTime = 0;
    bgAudio = null;
  }
}

function tryStartIntroMusic() {
  if (!introMusicStarted) {
    introMusicStarted = true;
    playBgMusic(bgMusicUrls.intro);
    const btnText = document.getElementById('musicBtnText');
    if (btnText) btnText.textContent = 'Выключить музыку';
  }
}

document.addEventListener('click', tryStartIntroMusic, { once: true, capture: true });
document.addEventListener('touchstart', tryStartIntroMusic, { once: true, capture: true });

function toggleMusic() {
  const btnText = document.getElementById('musicBtnText');
  if (bgAudio && !bgAudio.paused) {
    bgAudio.pause();
    if (btnText) btnText.textContent = 'Включить музыку';
  } else {
    introMusicStarted = true;
    let url = bgMusicUrls.intro;
    if (state.screen === 'game' && bgMusicUrls[state.currentRound]) {
      url = bgMusicUrls[state.currentRound];
    }
    playBgMusic(url);
    if (btnText) btnText.textContent = 'Выключить музыку';
  }
}

// === СНЕГ ===
function createSnow() {
  const container = document.getElementById('snowfall');
  const flakes = ['❄', '❅', '❆', '✦', '•'];
  for (let i = 0; i < 50; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    flake.textContent = flakes[Math.floor(Math.random() * flakes.length)];
    flake.style.left = Math.random() * 100 + '%';
    flake.style.fontSize = (Math.random() * 1.2 + 0.4) + 'em';
    flake.style.opacity = Math.random() * 0.6 + 0.2;
    flake.style.animationDuration = (Math.random() * 8 + 8) + 's';
    flake.style.animationDelay = (Math.random() * 15) + 's';
    container.appendChild(flake);
  }
}

// === ГИРЛЯНДА ===
function createGarland() {
  const g = document.getElementById('garland');
  for (let i = 0; i < 20; i++) {
    const light = document.createElement('div');
    light.className = 'garland-light';
    g.appendChild(light);
  }
}

// === ДАННЫЕ РАУНДОВ ===
const rounds = {
  quiz: {
    image: "https://raw.githubusercontent.com/almaastanova-web/musik/main/2026-11-16_08-43-30.png",
    name: "Викторина",
    emoji: "🎄",
    questions: [
      { image: "https://i.ibb.co/kYjK75b/6b531877-adee-44ac-9c1c-0c521770f47f.jpg", q: "В какой стране появился обычай украшать ёлку на Новый год?", options: ["Германия", "Россия", "Англия", "Франция"], correct: 0 },
      { image: "https://i.ibb.co/qYpnJvZc/unnamed.jpg", q: "В каком году Пётр I издал указ праздновать Новый год в России 1 января (а не 1 сентября)?", options: ["1700", "1600", "1800", "1940"], correct: 0 },
      { image: "https://i.ibb.co/CppD6KpD/563e0fbcd1ce8558f1d742e9c2c272be.jpg", q: "Какой город является официальной родиной российского Деда Мороза?", options: ["Москва", "Великий Устюг", "Санкт-Петербург", "Архангельск"], correct: 1 },
      { image: "https://i.ibb.co/j9S4jLLq/2026-11-12-09-55-45.png", q: "Сколько лучей у классической снежинки?", options: ["4", "5", "6", "8"], correct: 2 },
      { image: "https://i.ibb.co/HSN4tKr/Mir-novogodengo-kino.jpg", q: "Какой фильм традиционно показывают в России в новогоднюю ночь?", options: ["Ирония судьбы", "Карнавальная ночь", "Морозко", "Чародеи"], correct: 0 },
      { image: "https://i.ibb.co/d0gV7Kzh/the-year-2027-logo-with-celebratory-fireworks-with-text-space-celebrating-the-new-year-free-vector.jpg", q: "Какое животное является символом 2027 года по восточному календарю?", options: ["Дракон", "Тигр", "Коза", "Змея"], correct: 2 },
      { image: "https://i.ibb.co/h1wHwqwW/2026-11-12-10-09-24.png", q: "Где найти дождик зимой?", options: ["За окном", "На елке", "В салате", "В шкафу"], correct: 1 }
    ]
  },
  rebus: {
    name: "Ребусы",
    emoji: "🧩",
    questions: [
      { image: "https://i.ibb.co/N2YbxLqq/karnaval.png", q: "Какое слово зашифровано в этом ребусе?", answer: "Карнавал", hint: "Веселое шествие в ярких костюмах и масках" },
      { image: "https://i.ibb.co/pBWwvZLH/snegur.png", q: "Какое слово зашифровано в этом ребусе?", answer: "Снегурочка", hint: "Внучка и главная помощница Деда Мороза" },
      { image: "https://i.ibb.co/tPXWXPvG/prazdn.png", q: "Какое слово зашифровано в этом ребусе?", answer: "Праздник", hint: "Новый год, День рождения и другие радостные даты" },
      { image: "https://i.ibb.co/xqmxDgpb/hlop.png", q: "Какое слово зашифровано в этом ребусе?", answer: "Хлопушка", hint: "Новогоднее украшение, которое громко хлопает и выбрасывает конфетти" },
      { image: "https://i.ibb.co/HLhpNCLj/girlan.png", q: "Какое слово зашифровано в этом ребусе?", answer: "Гирлянда", hint: "Светящаяся лента, которой украшают ёлку" },
      { image: "https://i.ibb.co/ZzN4P6yP/snegov.png", q: "Какое слово зашифровано в этом ребусе?", answer: "Снеговик", hint: "Лепится из трёх снежных комов, с морковкой вместо носа" },
      { image: "https://i.ibb.co/pvCJYBTg/podar.png", q: "Какое слово зашифровано в этом ребусе?", answer: "Подарок", hint: "То, что кладут под ёлку в красивой упаковке" }
    ]
  },
  riddle: {
    name: "Загадки",
    emoji: "🎁",

// === СОСТОЯНИЕ ИГРЫ ===
let state = {
  screen: 'menu',
  currentRound: null,
  currentQuestion: 0,
  score: 0,
  totalScore: 0,
  answered: false,
  roundScores: {},
  userAnswers: []
};

let currentAudio = null;

// === РЕНДЕР ===
function render() {
  const app = document.getElementById('app');
  switch(state.screen) {
    case 'menu': renderMenu(app); break;
    case 'game': renderGame(app); break;
    case 'result': renderResult(app); break;
    case 'final': renderFinal(app); break;
  }
}

function renderMenu(app) {
  const roundKeys = Object.keys(rounds);
  let completedCount = Object.keys(state.roundScores).length;
  
  app.innerHTML = `
    <div class="card">
      <a href="https://raw.githubusercontent.com/almaastanova-web/musik/main/2026-11-16_08-43-30.png" target="_blank"><img src="https://raw.githubusercontent.com/almaastanova-web/musik/main/1b827704c6014b35b94cda216aa815c1.png" alt="Новогодняя открытка" style="max-width: 100%; height: auto; border-radius: 12px; margin: 0 auto 15px auto; display: block;" /></a>
      <h1 class="title">Фабрика загадок Деда Мороза</h1>
      <p class="subtitle">Год Огненной Козы • 6 раундов • 42 вопроса</p>
      <div class="tree-deco">🎄 ⭐ 🎁 🔔 🎄 ⭐ 🎁 🔔 🎄</div>
      ${state.totalScore > 0 ? `
        <div class="total-score-bar">
          🏆 Общий счёт: <strong style="color: var(--gold)">${state.totalScore}</strong> очков
        </div>
      ` : ''}
      <div class="rounds-grid" style="margin-top: 20px;">
        ${roundKeys.map(key => {
          const r = rounds[key];
          const done = state.roundScores[key] !== undefined;
          return `
            <button class="round-btn" onclick="startRound('${key}')" ${done ? 'style="opacity:0.7"' : ''}>
              <span class="label">${r.name}</span>
              ${done ? `<br><small style="color:var(--gold)">✓ ${state.roundScores[key]}/${r.questions.length}</small>` : `<br><small style="opacity:0.6">${r.questions.length} вопросов</small>`}
            </button>
          `;
        }).join('')}
      </div>
      ${completedCount === roundKeys.length ? `
        <div class="btn-row" style="margin-top:20px">
          <button class="btn-primary" onclick="showFinal()">🏆 Итоги</button>
          <button class="btn-secondary" onclick="resetGame()">🔄 Начать заново</button>
        </div>
      ` : ''}
    </div>
  `;
}

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
}

function startRound(key) {
  stopAudio();
  stopBgMusic();
  
  if (bgMusicUrls[key]) {
    playBgMusic(bgMusicUrls[key]);
    const btnText = document.getElementById('musicBtnText');
    if (btnText) btnText.textContent = 'Выключить музыку';
  }
  
  state.currentRound = key;
  state.currentQuestion = 0;
  state.score = 0;
  state.answered = false;
  state.userAnswers = [];
  state.screen = 'game';
  render();
}

function renderGame(app) {
  const round = rounds[state.currentRound];
  const q = round.questions[state.currentQuestion];
  const progress = ((state.currentQuestion) / round.questions.length) * 100;
  
  let imageStyle = 'width: 100%; height: 250px; object-fit: contain; border-radius: 12px; margin: 0 auto 15px auto; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.3); background: rgba(255,255,255,0.05);';
  
  if (state.currentRound === 'riddle') {
    imageStyle = 'width: 100%; height: 350px; object-fit: contain; border-radius: 12px; margin: 0 auto 15px auto; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.3); background: rgba(255,255,255,0.05);';
  }
  
  let questionHTML = '';
  
  switch(state.currentRound) {
    case 'quiz':
      questionHTML = `
        ${q.image ? `<img src="${q.image}" alt="Картинка к вопросу" style="${imageStyle}">` : ''}
        <div class="question-text">${q.q}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <button class="option-btn" onclick="answerChoice(${i}, ${q.correct}, '${opt.replace(/'/g, "\\'")}')">${opt}</button>
          `).join('')}
        </div>
      `;
      break;
      
    case 'rebus':
      questionHTML = `
        ${q.image ? `<img src="${q.image}" alt="Ребус" style="${imageStyle}">` : ''}
        <div class="question-text">${q.q || "Какое слово зашифровано в этом ребусе?"}</div>
        ${q.hint ? `<button class="btn-hint" id="hintBtn" onclick="showHint()">💡 Показать подсказку</button>` : ''}
        ${q.hint ? `<div class="hint-text" id="hintText" style="display: none;">${q.hint}</div>` : ''}
        <div class="tf-buttons" style="margin-top: 25px;">
          <button class="tf-btn true-btn" onclick="rebusSelfCheck(true)">✅ Ура!</button>
          <button class="tf-btn true-btn" onclick="rebusSelfCheck(true)">✅Следующий ребус</button>
        </div>
      `;
      break;
      
    case 'riddle':
      questionHTML = `
        ${q.image ? `<img src="${q.image}" alt="Картинка к вопросу" style="${imageStyle}">` : ''}
        <div class="question-text">${q.q}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <button class="option-btn" onclick="answerChoice(${i}, ${q.correct}, '${opt.replace(/'/g, "\\'")}')">${opt}</button>
          `).join('')}
        </div>
      `;
      break;
      
    case 'truth':
      questionHTML = `
        ${q.image ? `<img src="${q.image}" alt="Картинка" style="${imageStyle}">` : ''}
        <div class="question-text" style="font-size:1.15em">${q.statement}</div>
        <div class="tf-buttons">
          <button class="tf-btn true-btn" onclick="answerTruth(true)">✅ Правда</button>
          <button class="tf-btn false-btn" onclick="answerTruth(false)">❌ Ложь</button>
        </div>
      `;
      break;
      
    case 'poem':
      questionHTML = `
        ${q.image ? `<img src="${q.image}" alt="Картинка к вопросу" style="${imageStyle}">` : ''}
        <div class="question-text">Продолжи строчку из стихотворения:</div>
        <div class="poem-word">${q.q}</div>
        <div class="poem-guess">
          ${q.options.map((opt, i) => `
            <button class="poem-option" onclick="answerChoice(${i}, ${q.correct}, '${opt.replace(/'/g, "\\'")}')">${opt}</button>
          `).join('')}
        </div>
      `;
      break;
      
    case 'melody':
      questionHTML = `
        <img src="https://raw.githubusercontent.com/almaastanova-web/musik/main/ac1c07bddc754d6d8f49a357681038b5.png" alt="Угадай мелодию" style="width: 100%; max-width: 500px; height: auto; border-radius: 12px; margin: 0 auto 15px auto; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <div class="question-text">Угадай новогоднюю мелодию!</div>
        <button class="melody-play-btn" id="playBtn" onclick="playMelody()">🎵</button>
        <div class="rebus-display" style="text-align:center;font-size:1.2em;margin-bottom:20px;color:var(--gold)">${q.notes}</div>
        <div class="options">
          ${q.options.map((opt, i) => `
            <button class="option-btn" onclick="answerChoice(${i}, ${q.correct}, '${opt.replace(/'/g, "\\'")}')">${opt}</button>
          `).join('')}
        </div>
      `;
      break;
  }
  
  app.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <span style="font-size:1.3em">${round.emoji} ${round.name}</span>
        <span style="color:var(--gold)">⭐ ${state.score}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${progress}%"></div>
      </div>
      <div class="question-counter">Вопрос ${state.currentQuestion + 1} из ${round.questions.length}</div>
      ${questionHTML}
    </div>
  `;
}

// === ОБРАБОТКА ОТВЕТОВ ===
function answerChoice(selectedIndex, correctIndex, selectedText) {
  if (state.answered) return;
  state.answered = true;
  const isCorrect = selectedIndex === correctIndex;
  state.userAnswers.push({ isCorrect, answerValue: selectedText });
  if (isCorrect) state.score++;
  setTimeout(nextQuestion, 500);
}

function answerTruth(answer) {
  if (state.answered) return;
  state.answered = true;
  const q = rounds[state.currentRound].questions[state.currentQuestion];
  const isCorrect = answer === q.answer;
  state.userAnswers.push({ isCorrect, answerValue: answer ? 'Правда' : 'Ложь' });
  if (isCorrect) state.score++;
  setTimeout(nextQuestion, 500);
}

function rebusSelfCheck(guessed) {
  if (state.answered) return;
  state.answered = true;
  state.userAnswers.push({ 
    isCorrect: guessed, 
    answerValue: guessed ? 'Угадал' : 'Не угадал' 
  });
  if (guessed) state.score++;
  setTimeout(nextQuestion, 500);
}

function showHint() {
  const hintBtn = document.getElementById('hintBtn');
  const hintText = document.getElementById('hintText');
  if (hintBtn && hintText) {
    hintText.style.display = 'block';
    hintBtn.style.display = 'none';
  }
}

function playMelody() {
  const btn = document.getElementById('playBtn');
  
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
    btn.classList.remove('playing');
    return;
  }
  
  btn.classList.add('playing');
  const currentQ = rounds[state.currentRound].questions[state.currentQuestion];
  
  if (currentQ && currentQ.audioUrl) {
    currentAudio = new Audio(currentQ.audioUrl);
    currentAudio.play().catch(e => {
      console.log("Audio play failed:", e);
      btn.classList.remove('playing');
      currentAudio = null;
    });
    currentAudio.onended = () => {
      btn.classList.remove('playing');
      currentAudio = null;
    };
    currentAudio.onerror = () => {
      btn.classList.remove('playing');
      currentAudio = null;
    };
  } else {
    btn.classList.remove('playing');
  }
}

function nextQuestion() {
  stopAudio();
  state.currentQuestion++;
  state.answered = false;
  const round = rounds[state.currentRound];
  
  if (state.currentQuestion >= round.questions.length) {
    state.roundScores[state.currentRound] = state.score;
    state.totalScore = Object.values(state.roundScores).reduce((a, b) => a + b, 0);
    state.screen = 'result';
  }
  render();
}

function renderResult(app) {
  const round = rounds[state.currentRound];
  const pct = state.score / round.questions.length;
  let stars = '';
  let message = '';
  
  if (pct >= 0.85) { stars = '🌟🌟🌟'; message = 'Превосходно! Ты настоящий знаток Нового года!'; }
  else if (pct >= 0.6) { stars = '⭐⭐'; message = 'Отличный результат! Почти всё верно!'; }
  else if (pct >= 0.3) { stars = '⭐'; message = 'Неплохо! Но есть куда расти!'; }
  else { stars = '💫'; message = 'Попробуй ещё раз! Новый год — время чудес!'; }
  
  let breakdownHTML = round.questions.map((q, i) => {
    const userAns = state.userAnswers[i];
    if (!userAns) return '';
    
    let correctText = '';
    let userText = userAns.answerValue || 'Нет ответа';
    
    if (state.currentRound === 'rebus') {
      correctText = q.answer;
    } else if (state.currentRound === 'truth') {
      correctText = q.answer ? 'Правда' : 'Ложь';
    } else {
      correctText = q.options[q.correct];
    }
    
    const isCorrect = userAns.isCorrect;
    const borderColor = isCorrect ? '#2ecc71' : '#e74c3c';
    
    return `
      <div style="text-align:left; padding:12px; margin-bottom:10px; background:rgba(255,255,255,0.05); border-radius:10px; border-left: 4px solid ${borderColor}">
        <div style="font-size:0.85em; color:rgba(255,255,255,0.6); margin-bottom:4px;">Вопрос ${i+1}</div>
        <div style="margin-bottom:6px; font-size:0.95em;">${q.q || q.statement || q.notes}</div>
        ${state.currentRound !== 'rebus' ? `<div style="color:${isCorrect ? '#2ecc71' : '#e74c3c'}; font-size:0.9em;">Ваш ответ: ${userText}</div>` : ''}
        ${state.currentRound === 'rebus' || !isCorrect ? `<div style="color:#2ecc71; font-size:0.95em; font-weight:bold; margin-top:4px;">✅ Правильный ответ: ${correctText}</div>` : ''}
        ${q.explanation ? `<div style="font-size:0.8em; color:rgba(255,255,255,0.5); margin-top:6px; font-style:italic;">${q.explanation}</div>` : ''}
      </div>
    `;
  }).join('');
  
  app.innerHTML = `
    <div class="card">
      <div style="font-size:3em; text-align:center; margin-bottom:10px;">${round.emoji}</div>
      <h2 class="title">${round.name} — Результаты</h2>
      <div class="result-stars">${stars}</div>
      <div class="result-score">${state.score} / ${round.questions.length}</div>
      <p class="result-message">${message}</p>
      
      <div style="max-height: 300px; overflow-y: auto; margin: 20px 0; padding-right: 5px; scrollbar-width: thin; scrollbar-color: var(--gold) rgba(255,255,255,0.1);">
        ${breakdownHTML}
      </div>
      
      <div class="total-score-bar">
        🏆 Общий счёт: <strong style="color:var(--gold)">${state.totalScore}</strong> очков
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="goMenu()">🏠 В меню</button>
        <button class="btn-secondary" onclick="startRound('${state.currentRound}')">🔄 Повторить</button>
      </div>
    </div>
  `;
  
  if (pct >= 0.6) launchConfetti();
}

function showFinal() {
  state.screen = 'final';
  render();
  launchConfetti();
}

function renderFinal(app) {
  const total = state.totalScore;
  const max = Object.values(rounds).reduce((sum, round) => sum + round.questions.length, 0);
  const pct = total / max;
  
  let title, message, emoji;
  if (pct >= 0.85) { title = 'Новогодний Чемпион!'; message = 'Ты — настоящий мастер новогодних праздников! Огненная Коза гордится тобой!'; emoji = '🏆🐐🔥'; }
  else if (pct >= 0.6) { title = 'Отличный результат!'; message = 'Ты прекрасно знаешь новогодние традиции! Так держать!'; emoji = '🎄⭐🎉'; }
  else if (pct >= 0.3) { title = 'Хороший старт!'; message = 'Новый год — время узнавать новое! Попробуй ещё раз!'; emoji = '🎁✨🐐'; }
  else { title = 'Попробуй ещё!'; message = 'Впереди много новогодних чудес! Возвращайся и играй снова!'; emoji = '🎅❄️🎄'; }
  
  app.innerHTML = `
    <div class="card">
      <div class="goat-emoji">${emoji}</div>
      <h1 class="title">${title}</h1>
      <div class="result-stars">🌟🌟🌟</div>
      <div class="result-score">${total} / ${max}</div>
      <p class="result-message">${message}</p>
      
      <div style="margin:20px 0">
        ${Object.keys(rounds).map(key => `
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.1)">
            <span>${rounds[key].emoji} ${rounds[key].name}</span>
            <span style="color:var(--gold)">${state.roundScores[key] || 0}/${rounds[key].questions.length}</span>
          </div>
        `).join('')}
      </div>
      
      <div class="tree-deco">🎄 ⭐ 🎁 🔔 🐐 🔔 🎁 ⭐ 🎄</div>
      <p style="text-align:center;margin-top:15px;color:rgba(255,255,255,0.6);font-size:0.9em">
        🎆 С Наступающим Новым 2027 Годом! 🎆<br>
        Год Огненной Козы принесёт удачу! 🐐🔥
      </p>
      
      <div class="btn-row">
        <button class="btn-primary" onclick="resetGame()">🔄 Играть снова</button>
        <button class="btn-secondary" onclick="goMenu()">🏠 В меню</button>
      </div>
    </div>
  `;
}

function goMenu() {
  stopAudio();
  state.screen = 'menu';
  if (introMusicStarted) {
    playBgMusic(bgMusicUrls.intro);
    const btnText = document.getElementById('musicBtnText');
    if (btnText) btnText.textContent = 'Выключить музыку';
  }
  render();
}

function resetGame() {
  stopAudio();
  stopBgMusic();
  introMusicStarted = false;
  state = { screen: 'menu', currentRound: null, currentQuestion: 0, score: 0, totalScore: 0, answered: false, roundScores: {}, userAnswers: [] };
  const btnText = document.getElementById('musicBtnText');
  if (btnText) btnText.textContent = 'Включить музыку';
  render();
}

// === КОНФЕТТИ ===
function launchConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);
  
  const colors = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e67e22'];
  
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 2 + 's';
    piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    piece.style.width = (Math.random() * 8 + 5) + 'px';
    piece.style.height = (Math.random() * 8 + 5) + 'px';
    container.appendChild(piece);
  }
  
  setTimeout(() => container.remove(), 4000);
}

// === ИНИЦИАЛИЗАЦИЯ ===
createSnow();
createGarland();
render();
</script>
